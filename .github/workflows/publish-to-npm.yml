name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Verify version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - name: Build archive
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          cp /tmp/elsebit-dsh-deepseek-usage-extended-*.tgz dsh-deepseek-usage-extended.tgz
          sha256sum dsh-deepseek-usage-extended.tgz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-deepseek-usage-extended.tgz SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME" --notes 'Extends upstream provider support with IKunCode account balance queries. Includes a prebuilt package and SHA256 checksum. Provider settings and HTTP routes use a separate namespace.'
